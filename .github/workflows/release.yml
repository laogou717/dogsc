name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ -s ".github/release-notes/${GITHUB_REF_NAME}.md" ]]
          release_version="${GITHUB_REF_NAME#v}"
          short_version="${release_version%%-*}"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" = "$short_version" ]]
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          for resource in en.lproj zh-Hans.lproj Fonts Onboarding Support; do
            [[ -d "Resources/$resource" ]]
          done

      - name: Import stable signing identity
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.DOGSC_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.DOGSC_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DOGSC_SIGNING_IDENTITY_SHA1 }}
        run: |
          set -euo pipefail

          [[ -n "${SIGNING_CERTIFICATE_P12:-}" ]] || {
            echo "::error::DOGSC_SIGNING_CERTIFICATE_P12 is required"
            exit 1
          }
          [[ -n "${SIGNING_CERTIFICATE_PASSWORD:-}" ]] || {
            echo "::error::DOGSC_SIGNING_CERTIFICATE_PASSWORD is required"
            exit 1
          }
          [[ -n "${SIGNING_IDENTITY:-}" ]] || {
            echo "::error::DOGSC_SIGNING_IDENTITY_SHA1 is required"
            exit 1
          }

          certificate_path="$RUNNER_TEMP/dogsc-signing.p12"
          keychain_path="$RUNNER_TEMP/dogsc-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "$SIGNING_IDENTITY"
          echo "DOGSC_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build app
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          SIGNING_IDENTITY: ${{ secrets.DOGSC_SIGNING_IDENTITY_SHA1 }}
        run: |
          set -euo pipefail
          swift build -c release --product DogSC
          binary_dir="$(swift build -c release --show-bin-path)"

          app="$RUNNER_TEMP/DogSC.app"
          mkdir -p \
            "$app/Contents/MacOS" \
            "$app/Contents/Frameworks" \
            "$app/Contents/Resources"
          cp "$binary_dir/DogSC" "$app/Contents/MacOS/DogSC"
          cp "Resources/Info.plist" "$app/Contents/Info.plist"
          cp "Resources/AppIcon.icns" "$app/Contents/Resources/AppIcon.icns"
          for resource in en.lproj zh-Hans.lproj Fonts Onboarding Support; do
            ditto "Resources/$resource" "$app/Contents/Resources/$resource"
            diff -qr "Resources/$resource" "$app/Contents/Resources/$resource"
          done
          for language in en zh-Hans; do
            plutil -lint "$app/Contents/Resources/$language.lproj/Localizable.strings"
            plutil -lint "$app/Contents/Resources/$language.lproj/InfoPlist.strings"
          done
          (cd "$app/Contents/Resources/Fonts" && shasum -a 256 -c SHA256SUMS)

          sparkle_framework="$(
            find .build/artifacts \
              -type d \
              -name Sparkle.framework \
              -path '*macos-arm64_x86_64*' \
              -print \
              -quit
          )"
          [[ -n "$sparkle_framework" ]]
          ditto "$sparkle_framework" "$app/Contents/Frameworks/Sparkle.framework"

          embedded_sparkle="$app/Contents/Frameworks/Sparkle.framework"
          sparkle_version="$embedded_sparkle/Versions/B"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --keychain "$DOGSC_SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$sparkle_version/XPCServices/Installer.xpc"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --preserve-metadata=entitlements \
            --keychain "$DOGSC_SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$sparkle_version/XPCServices/Downloader.xpc"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --keychain "$DOGSC_SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$sparkle_version/Autoupdate"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --keychain "$DOGSC_SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$sparkle_version/Updater.app"
          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --keychain "$DOGSC_SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$embedded_sparkle"
          codesign --verify --deep --strict "$embedded_sparkle"

          codesign \
            --force \
            --options runtime \
            --timestamp=none \
            --entitlements "Resources/DogSC.entitlements" \
            --keychain "$DOGSC_SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$app"
          codesign --verify --deep --strict "$app"

          signature_details="$(codesign -dvvv "$app" 2>&1)"
          requirements="$(codesign -dr - "$app" 2>&1)"
          grep -F 'Authority=Apple Development:' <<< "$signature_details"
          ! grep -F 'Signature=adhoc' <<< "$signature_details"
          ! grep -F 'TeamIdentifier=not set' <<< "$signature_details"
          grep -F 'identifier "cn.laogou.dogsc"' <<< "$requirements"
          grep -F 'anchor apple generic' <<< "$requirements"

      - name: Create disk image
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/DogSC.app"
          disk_image="$RUNNER_TEMP/DogSC-${GITHUB_REF_NAME}-macOS.dmg"
          settings="$RUNNER_TEMP/dmg-settings.py"
          dmgbuild_env="$RUNNER_TEMP/dmgbuild"
          dmg_background="$RUNNER_TEMP/DMGBackground.png"

          # Finder requires a 640 × 420 point representation. dmgbuild joins
          # the matching 1x/2x files into a native HiDPI TIFF; the original AI
          # background remains unchanged and supplies the full Retina pixels.
          sips --resampleHeightWidth 420 640 \
            --setProperty dpiWidth 72 --setProperty dpiHeight 72 \
            "$GITHUB_WORKSPACE/Resources/DMGBackground.png" \
            --out "$dmg_background" >/dev/null
          sips --setProperty dpiWidth 144 --setProperty dpiHeight 144 \
            "$GITHUB_WORKSPACE/Resources/DMGBackground.png" \
            --out "$RUNNER_TEMP/DMGBackground@2x.png" >/dev/null

          cat > "$settings" <<'PY'
          application = defines["app"]
          background = defines["background"]
          icon = defines["icon"]
          files = [application]
          symlinks = {"Applications": "/Applications"}
          icon_locations = {
              "DogSC.app": (188, 176),
              "Applications": (452, 176),
              ".background.png": (900, 176),
              ".background.tiff": (1100, 176),
              ".VolumeIcon.icns": (1300, 176),
              ".DS_Store": (1500, 176),
          }
          # Finder handles the .app label; additional FinderInfo edits after
          # signing would invalidate strict signature verification.
          hide_extensions = []
          # 640 × 420 points plus title/status-bar space.
          window_rect = ((200, 120), (640, 480))
          default_view = "icon-view"
          show_status_bar = False
          show_tab_view = False
          show_toolbar = False
          show_pathbar = False
          show_sidebar = False
          show_icon_preview = False
          scroll_position = (0, 0)
          arrange_by = None
          label_pos = "bottom"
          text_size = 13
          icon_size = 112
          format = "UDZO"
          compression_level = 9
          PY

          python3 -m venv "$dmgbuild_env"
          "$dmgbuild_env/bin/pip" install \
            --disable-pip-version-check \
            --quiet \
            dmgbuild==1.6.7
          "$dmgbuild_env/bin/dmgbuild" \
            -s "$settings" \
            -D app="$app" \
            -D background="$dmg_background" \
            -D icon="$GITHUB_WORKSPACE/Resources/AppIcon.icns" \
            "DogSC Installer" \
            "$disk_image"

          hdiutil verify "$disk_image"

          mounted_image="$RUNNER_TEMP/mounted-image"
          mkdir -p "$mounted_image"
          diskutil image attach \
            --readOnly \
            --nobrowse \
            --mountPoint "$mounted_image" \
            "$disk_image" >/dev/null
          trap 'diskutil eject "$mounted_image" >/dev/null 2>&1 || true' EXIT
          [[ -d "$mounted_image/DogSC.app" ]]
          [[ -L "$mounted_image/Applications" ]]
          [[ "$(readlink "$mounted_image/Applications")" = "/Applications" ]]
          [[ -f "$mounted_image/.DS_Store" ]]
          codesign --verify --deep --strict "$mounted_image/DogSC.app"
          diskutil eject "$mounted_image"
          trap - EXIT

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.DOGSC_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SPARKLE_PRIVATE_KEY:-}" ]] || {
            echo "::error::DOGSC_SPARKLE_PRIVATE_KEY is required"
            exit 1
          }

          updates_dir="$RUNNER_TEMP/sparkle-updates"
          disk_image="$RUNNER_TEMP/DogSC-${GITHUB_REF_NAME}-macOS.dmg"
          appcast="$RUNNER_TEMP/appcast.xml"
          mkdir -p "$updates_dir"
          cp "$disk_image" "$updates_dir/"

          generate_appcast="$(
            find .build/artifacts \
              -type f \
              -name generate_appcast \
              -print \
              -quit
          )"
          [[ -x "$generate_appcast" ]]
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$generate_appcast" \
                --ed-key-file - \
                --download-url-prefix \
                "https://github.com/laogou717/dogsc/releases/download/${GITHUB_REF_NAME}/" \
                --link "https://github.com/laogou717/dogsc" \
                -o "$appcast" \
                "$updates_dir"

          xmllint --noout "$appcast"
          grep -F "DogSC-${GITHUB_REF_NAME}-macOS.dmg" "$appcast"
          grep -F 'sparkle:edSignature=' "$appcast"

      - name: Prepare release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/DogSC-${GITHUB_REF_NAME}-macOS.dmg" \
            "$RUNNER_TEMP/appcast.xml" \
            --draft \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "DogSC $GITHUB_REF_NAME" \
            --verify-tag
